[project]
name = "procontel-boletas"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.3",
    "uvicorn>=0.38.0",
    "openpyxl==3.1.5",
    "reportlab>=4.4.5",
    "defusedxml==0.7.1",
    "python-multipart>=0.0.31",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx==0.28.1",
    "ruff==0.14.6",
    "mypy==1.18.2",
    "types-openpyxl",
    "types-reportlab",
    "pypdf>=6.21.4",
    "pip-audit>=2.9",
    "types-defusedxml>=0.7.0.20260504",
    "pymupdf>=2.1",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]

