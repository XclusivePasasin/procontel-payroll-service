# Install inside nginx's http context (sites-enabled on Debian/Ubuntu).
# Replace boletas.example.com and certificate paths before enabling.
limit_req_zone $binary_remote_addr zone=procontel_api:1m rate=12r/m;
limit_req_zone $binary_remote_addr zone=procontel_entry:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=procontel_connections:1m;

server {
    listen 80;
    server_name boletas.example.com;
    return 301 https://boletas.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name boletas.example.com;
    ssl_certificate /etc/letsencrypt/live/boletas.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boletas.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/procontel-error.log crit;
    root /opt/procontel/frontend/dist;
    index index.html;
    auth_basic "Procontel - Acceso autorizado";
    auth_basic_user_file /etc/procontel/payroll.htpasswd;
    include /etc/nginx/snippets/procontel-security.conf;
    add_header Cache-Control "no-store, private" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 15m;
    client_body_buffer_size 15m;
    client_header_timeout 20s;
    client_body_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_req zone=procontel_entry burst=20 nodelay;
    limit_req_status 429;

    location /api/ {
        limit_req zone=procontel_api burst=6 nodelay;
        limit_req_status 429;
        limit_conn procontel_connections 4;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        error_page 413 = @too_large;
        error_page 429 = @capacity;
        error_page 502 504 = @timeout;
    }
    location @too_large {
        include /etc/nginx/snippets/procontel-security.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store, private" always;
        default_type application/json;
        return 413 '{"code":"UPLOAD_LIMIT","message":"La carga supera el limite permitido.","issues":[]}';
    }
    location @capacity {
        include /etc/nginx/snippets/procontel-security.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store, private" always;
        default_type application/json;
        return 429 '{"code":"CAPACITY_EXCEEDED","message":"Demasiadas solicitudes; intenta de nuevo.","issues":[]}';
    }
    location @timeout {
        include /etc/nginx/snippets/procontel-security.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store, private" always;
        default_type application/json;
        return 504 '{"code":"PROCESS_TIMEOUT","message":"El servicio excedio el tiempo permitido.","issues":[]}';
    }
    location /assets/ {
        include /etc/nginx/snippets/procontel-security.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
